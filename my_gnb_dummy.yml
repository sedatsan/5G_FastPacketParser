# 1. Core Network configuration (with Core bypassed)
cu_cp:
  amf:
    no_core: true
    addrs: 127.0.1.100
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

# 2. Simulated Radio Hardware
ru_dummy:
  dl_processing_delay: 1
  time_scaling: 1

# 3. 100MHz 4x2 Cell Configuration
cell_cfg:
  dl_arfcn: 637212
  band: 78
  channel_bandwidth_MHz: 100
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  nof_antennas_dl: 4
  nof_antennas_ul: 2
  prach:
    prach_config_index: 159
    prach_root_sequence_index: 1
    zero_correlation_zone: 0
  ssb:
    ssb_block_power_dbm: -4
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 10
    nof_dl_slots: 7
    nof_dl_symbols: 6
    nof_ul_slots: 2
    nof_ul_symbols: 4

# 4. Traffic Generator
test_mode:
  test_ue:
    rnti: 0x44
    ri: 1 
    cqi: 15
    nof_ues: 1
    pusch_active: true
    pdsch_active: true

# 5. Logging and PCAP Output
log:
  filename: /tmp/gnb.log
  all_level: warning

pcap:
  mac_enable: true
  mac_filename: /tmp/gnb_mac.pcap
  mac_type: dlt
  ngap_enable: false
